; Example values. Do not commit real credentials: set the environment
; variables shown on the right instead (they override this file).
[test_server]
; MEDULLA_URL: web server root, without /mmc
name = https://medulla.example.com
; MEDULLA_HOST: host used for MySQL and SSH checks
ssh = medulla.example.com
; MEDULLA_USER / MEDULLA_PASSWORD
login = root
password = change-me
; MYSQL_PORT / MYSQL_USER / MYSQL_PASSWORD
port = 3306
mysqluser = root
mysqlpass = change-me
; MEDULLA_MACHINE: Windows machine with a Medulla agent
machinename = qa-win-6
; SSH_KEY_PATH / SSH_KEY_PASSPHRASE: root SSH key on MEDULLA_HOST
passkey_path = /path/to/id_rsa
passphrase = change-me
